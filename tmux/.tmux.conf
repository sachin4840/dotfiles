set -g mouse on
setw -g mode-keys vi
set -g history-limit 100000
set -g status-keys vi

# Prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set the base index for windows and panes
set -g base-index 1
setw -g pane-base-index 1

# Set clipboard options
set-option -g set-clipboard on



# Split panes
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-sessionist - Session management
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Auto-save every 10 min, restore on launch
set -g @resurrect-save-on-exit 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Run TPM
run '~/.tmux/plugins/tpm/tpm'

# --- FZF Session Switcher ---
# Requires fzf installed: brew install fzf
# Save this as ~/bin/tmux-sessionizer and make it executable

# bind-key F1 run-shell "tmux run-shell '~/bin/tmux-sessionizer'"
bind-key C-f run-shell "tmux run-shell '~/bin/tmux-sessionizer'"
